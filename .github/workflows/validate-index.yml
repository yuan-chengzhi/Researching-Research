name: Validate research atlas

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test metadata and rendering boundaries
        run: python -m unittest discover -s tests -v
      - name: Validate generated index
        run: python scripts/build_index.py --check
